name: Performance Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  million-row-evidence:
    name: Million-row plans and load
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: log_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d log_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: log_pulse
      DB_SSL: false
      ALLOW_PERFORMANCE_RESET: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install, migrate, and seed
        run: |
          npm ci
          npm run migration:run
          npm run perf:seed -- --rows=1000000 --reset

      - name: Capture EXPLAIN evidence
        run: npm run perf:explain

      - name: Start service
        run: |
          npm run build
          npm run start:prod > application.log 2>&1 &

      - name: Run 15-minute workload
        run: npm run perf:load -- --duration=15m --accepted-rate=500

      - name: Run retention benchmark
        run: npm run perf:retention -- --expired-rows=2000000

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-${{ github.sha }}
          path: |
            docs/performance/explain/*.json
            docs/performance/results/*.json
            application.log
          retention-days: 30
