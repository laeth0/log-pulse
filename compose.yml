services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-log_pulse_password}
      DB_NAME: ${DB_NAME:-log_pulse}
      DB_SSL: 'false'
      LOG_RETENTION_ENABLED: ${LOG_RETENTION_ENABLED:-true}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_RETENTION_BATCH_SIZE: ${LOG_RETENTION_BATCH_SIZE:-1000}
      LOG_RETENTION_MAX_BATCHES: ${LOG_RETENTION_MAX_BATCHES:-10}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-log_pulse_password}
      POSTGRES_DB: ${DB_NAME:-log_pulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
