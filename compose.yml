x-application-environment: &application-environment
  NODE_ENV: production
  PORT: 8080
  HTTP_BODY_LIMIT_BYTES: ${HTTP_BODY_LIMIT_BYTES:-52428800}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASS: ${DB_PASS:-log_pulse_password}
  DB_NAME: ${DB_NAME:-log_pulse}
  DB_SSL: ${DB_SSL:-false}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
  DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
  LOG_INGEST_CHUNK_SIZE: ${LOG_INGEST_CHUNK_SIZE:-1000}
  LOG_RETENTION_ENABLED: ${LOG_RETENTION_ENABLED:-true}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
  LOG_RETENTION_BATCH_SIZE: ${LOG_RETENTION_BATCH_SIZE:-5000}
  LOG_RETENTION_MAX_BATCHES: ${LOG_RETENTION_MAX_BATCHES:-400}
  LOG_RETENTION_MAX_RUN_MS: ${LOG_RETENTION_MAX_RUN_MS:-3300000}
  ALLOW_DATABASE_DROP: ${ALLOW_DATABASE_DROP:-false}
  ALLOW_PERFORMANCE_RESET: ${ALLOW_PERFORMANCE_RESET:-false}

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *application-environment
    command: ['node', 'dist/scripts/run-migrations.js']
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *application-environment
    ports:
      - '${API_HOST_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-log_pulse_password}
      POSTGRES_DB: ${DB_NAME:-log_pulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
